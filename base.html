<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10221c">
  <title>{% block title %}FitBuddy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="FitBuddy home"><span class="brand-icon">F</span><span>fitbuddy<span class="brand-dot">.</span></span></a>
    <nav><a href="/">Plan builder</a><a href="/docs">API docs</a></nav>
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
  <footer class="footer"><span>FitBuddy · Student AI fitness project</span><span>Move well. Recover well.</span></footer>
</body>
</html>
